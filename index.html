<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =========================================================
   1. TOKENS
   Layout: segue a referência do Figma. Texto à esquerda,
   card de perfil à direita, cursor "Malu" sobre o card.
   Tema único claro (não acompanha o modo escuro do sistema).
   ========================================================= */
:root {
  color-scheme: light;
  --bg: #F8F8F8;
  --surface: #FFFFFF;
  --fg: #262626;
  --text: #333333;
  --muted: #6B6B6B;
  --line: #CFCFCF;
  --accent: #F9C23C;
  --accent-ink: #1E1A10;
  --select: #0D99FF;

  /* Mango Grotesque se estiver instalada/hospedada; Antonio é o substituto provisório */
  --font-display: "Mango Grotesque", "Antonio", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;

  /* Escala (base: frame de 1440px) */
  --fs-hero: clamp(4.5rem, 9.6vw, 9rem);
  --fs-h2: clamp(3rem, 6vw, 5.5rem);
  --fs-logo: clamp(2.5rem, 3.6vw, 3.5rem);
  --fs-lead: clamp(1.0625rem, 1.3vw, 1.25rem);
  --fs-nav: clamp(1rem, 1.2vw, 1.25rem);
  --fs-small: 0.875rem;

  --gutter: clamp(16px, 7.8vw, 112px);
  --maxw: 1440px;
  --radius-card: 14px;
}

/* =========================================================
   2. BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 4px; border-radius: 4px; }
.container { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }

/* =========================================================
   3. COMPONENTES
   ========================================================= */


/* --- Hero --- */
.fold { display: flex; flex-direction: column; }
.hero { flex: 1; display: flex; align-items: flex-start; padding-block: clamp(32px, 5vw, 80px) clamp(32px, 4vw, 56px); }
.hero__grid {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: clamp(40px, 6vw, 96px);
  align-items: center;
}
.hero__text { display: flex; flex-direction: column; min-width: 0; }
.hero__title {
  font-family: var(--font-display); font-weight: 600;
  font-size: var(--fs-hero); line-height: 0.95; letter-spacing: -0.015em;
  color: var(--fg); margin: 0 0 clamp(24px, 2.6vw, 36px);
  white-space: nowrap; /* tamanho ajustado por JS para caber em uma linha */
}
.hero__lead { font-size: var(--fs-lead); line-height: 1.75; max-width: 30em; margin: 0 0 clamp(16px, 1.6vw, 24px); }
.hero__cta { font-size: var(--fs-lead); line-height: 1.75; color: var(--text); margin: 0; }
.hero__cta .strong-link { color: var(--fg); }
.strong-link { font-weight: 700; color: var(--muted); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.strong-link:hover { color: var(--fg); }

/* --- Card de perfil --- */
.card-wrap { position: relative; min-width: 0; }
.card {
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 24px;
  box-shadow: 0 2px 4px rgb(0 0 0 / .03), 0 16px 36px -20px rgb(0 0 0 / .14);
  display: flex; flex-direction: column; gap: clamp(20px, 2.4vw, 32px);
}
.profile { display: flex; align-items: center; gap: clamp(16px, 1.8vw, 24px); }
.avatar {
  flex: none; width: clamp(64px, 7vw, 100px); height: auto; aspect-ratio: 1; border-radius: 50%;
  object-fit: cover; background: #E9E9E9;
}
.profile__name { font-weight: 600; font-size: clamp(1.25rem, 1.6vw, 1.5rem); color: var(--fg); line-height: 1.25; margin: 0; }
.profile__role { color: var(--muted); font-size: clamp(0.9375rem, 1.1vw, 1.0625rem); margin: 4px 0 0; }
.chips { display: flex; flex-wrap: nowrap; gap: 8px; list-style: none; margin: 14px 0 0; padding: 0; }
.profile > div { min-width: 0; }
.role-sep { display: none; }   /* desktop: cidade na linha de baixo */
.chip { white-space: nowrap; font-size: 0.8125rem; line-height: 1.2; padding: 5px 14px; border: 1.5px solid #C4C4C4; border-radius: 999px; color: var(--text); background: var(--surface); }
.card__bio { color: var(--muted); font-size: 0.875rem; line-height: 1.7; margin: 0; }
.card__cta { color: var(--muted); font-size: 0.875rem; line-height: 1.7; margin: 0; margin-top: calc(10px - clamp(20px, 2.4vw, 32px)); /* ~10px abaixo do texto */ }
.card__cta .strong-link { color: var(--fg); }
.card__more { color: var(--muted); font-size: clamp(0.9375rem, 1.1vw, 1.0625rem); margin: 0; }

/* --- Cursor de "colaboradora" (posicionado por JS dentro da dobra) --- */
.fold { position: relative; overflow-x: clip; } /* sem rolagem lateral; o cursor pode usar o respiro abaixo do card */
.cursor {
  position: absolute; left: 0; top: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: flex-start;
  pointer-events: none; will-change: transform;
}
.cursor svg { width: 20px; height: 20px; display: block; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .35)); }
.cursor__label {
  background: var(--accent); color: var(--accent-ink);
  font-size: 0.6875rem; font-weight: 500; line-height: 1;
  padding: 4px 7px; border-radius: 4px; margin-left: 14px; margin-top: 2px;
  box-shadow: 0 3px 8px -4px rgb(0 0 0 / .3);
}

/* --- Indicação de scroll --- */
.scroll-cue { padding-block: 0 clamp(24px, 3vw, 40px); }
.scroll-cue a {
  display: inline-flex; align-items: center; gap: 14px;
  font-size: 0.8125rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  text-decoration: none; color: var(--muted);
}
.scroll-cue__line { position: relative; width: 1.5px; height: 44px; background: var(--line); overflow: hidden; }
.scroll-cue__line::after {
  content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 40%;
  background: var(--fg); animation: fall 2.2s ease-in-out infinite;
}
@keyframes fall { 0% { transform: translateY(-100%); } 100% { transform: translateY(260%); } }

/* --- Stub da próxima seção --- */
.next { padding-block: clamp(64px, 8vw, 120px); border-top: 1px solid #E6E6E6; }
.next__title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h2); line-height: .95; color: var(--fg); margin: 0 0 32px; }
.slot {
  border: 1.5px dashed var(--line); border-radius: var(--radius-card);
  min-height: 220px; display: grid; place-items: center; text-align: center; padding: 24px;
  color: var(--muted); font-size: 0.9375rem;
}


/* --- Áreas de atuação --- */
.section { padding-block: clamp(56px, 7vw, 104px); }
.services { padding-block-start: clamp(40px, 5vw, 72px); }
.services__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(32px, 4vw, 64px); }
.service { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.service__title { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.25rem, 3.4vw, 3.25rem); line-height: 1; color: var(--fg); margin: 0; }
.service__text { font-size: var(--fs-lead); line-height: 1.6; margin: 0; max-width: 26em; }

/* --- Projetos principais --- */
.projects__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; margin-bottom: clamp(32px, 4vw, 56px); }
.section__title { font-family: var(--font-display); font-weight: 600; font-size: clamp(3rem, 6vw, 5.5rem); line-height: .95; color: var(--fg); margin: 0; }
.btn-outline {
  flex: none; display: inline-flex; align-items: center;
  font-weight: 700; font-size: clamp(0.9375rem, 1.1vw, 1.0625rem); color: var(--fg); text-decoration: none;
  padding: 14px 26px; border: 2px solid var(--fg); border-radius: 8px;
  transition: background .2s, color .2s;
}
.btn-outline:hover { background: var(--fg); color: var(--bg); }
.projects__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 2vw, 32px); }
.project {
  background: var(--surface); border: 1px solid #E2E2E2; border-radius: var(--radius-card);
  overflow: hidden; display: flex; flex-direction: column; min-width: 0;
}
.project {
  box-shadow: 0 1px 2px rgb(0 0 0 / .03);
  transition: transform 260ms ease-out, box-shadow 260ms ease-out;
}
@media (hover: hover) {
  .project:hover {
    transform: translateY(-5px);
    box-shadow: 0 2px 6px rgb(0 0 0 / .04), 0 12px 32px rgb(0 0 0 / .09);
  }
}
@media (prefers-reduced-motion: reduce) { .project:hover { transform: none; } }
.project--link { text-decoration: none; color: inherit; cursor: pointer; }
.project--link:focus-visible { outline-offset: 6px; border-radius: var(--radius-card); }
.project__media { aspect-ratio: 1167 / 552; border-bottom: 1px solid #E2E2E2; }
.project__ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--muted); font-size: 0.875rem; background: #F1F1EF; }
.project__media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.project__body { padding: clamp(20px, 2.2vw, 32px) clamp(20px, 2.2vw, 32px) clamp(28px, 3vw, 44px); display: flex; flex-direction: column; gap: 12px; }
.project__title { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 3.2vw, 3rem); line-height: 1; color: var(--fg); margin: 0; text-wrap: balance; }
.project__text { font-size: var(--fs-lead); line-height: 1.6; margin: 0; }

/* --- Marcação de conteúdo provisório --- */
.show-ph [data-ph] { outline: 1px dashed var(--select); outline-offset: 6px; }
.dev-pill {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: flex; align-items: center; gap: 12px;
  background: var(--fg); color: var(--bg);
  font-size: 0.75rem; padding: 8px 8px 8px 14px; border-radius: 999px;
}
.dev-pill button { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg); border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; }

/* =========================================================
   4. RESPONSIVO
   ========================================================= */
@media (max-width: 1024px) {
  .services__grid { grid-template-columns: minmax(0, 1fr); }
  .projects__grid { grid-template-columns: minmax(0, 1fr); }
  .hero__grid { grid-template-columns: minmax(0, 1fr); gap: 64px; }
  .card-wrap { max-width: 560px; }
  .fold { min-height: 0; }
}
/* telas médias com duas colunas: tags podem quebrar para não vazar do card */
@media (min-width: 1025px) and (max-width: 1279px) { .chips { flex-wrap: wrap; } }
@media (max-width: 760px) {
  .chips { flex-wrap: wrap; }
  /* card no celular: foto alinhada a nome + cargo; tags abaixo do bloco */
  .profile { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; align-items: center; }
  .profile > div { display: contents; }
  .profile .avatar { grid-row: 1 / 3; }
  .profile__name { grid-column: 2; grid-row: 1; align-self: end; }
  .profile__role { grid-column: 2; grid-row: 2; align-self: start; }
  .profile .chips { grid-column: 1 / -1; grid-row: 3; margin-top: 18px; }
  .chip { font-size: 0.75rem; padding: 4px 12px; }
  .role-sep { display: inline; }   /* celular: mantém "Product Designer | São Paulo, Brasil" */
  .role-br { display: none; }
  .hero__title { white-space: normal; text-wrap: balance; }
}
@media (prefers-reduced-motion: reduce) { .scroll-cue__line::after { animation: none; } }
</style>

// Título em uma linha: reduz a fonte até caber na largura da coluna (desktop/tablet)
const title = document.getElementById("hero-title");
const fitTitle = () => {
  title.style.fontSize = "";
  if (window.matchMedia("(max-width: 760px)").matches) return;
  const box = title.parentElement.clientWidth;
  const base = parseFloat(getComputedStyle(title).fontSize);
  if (title.scrollWidth > box) title.style.fontSize = `${Math.floor(base * box / title.scrollWidth)}px`;
};
fitTitle();
if (document.fonts) document.fonts.ready.then(fitTitle);
if ("ResizeObserver" in window) new ResizeObserver(fitTitle).observe(title.parentElement);

/* ---------------------------------------------------------
   Cursor "Malu": passeia devagar pelos espaços vazios da dobra.
   - Obstáculos = caixas dos elementos de conteúdo (+ margem).
   - Destinos sorteados só onde o cursor inteiro cabe sem tocar em nada.
   - Trajeto curvo; cada trecho é testado antes de ser usado.
   - Velocidade variável, pequenas pausas e um leve tremor de mão.
   --------------------------------------------------------- */
(function cursorPath() {
  /* Trajetória fixa desenhada pela Malu (traçado azul):
     lateral direita do card → desce → laço no canto inferior direito → passa por baixo do card
     → curva à esquerda → sobe até "Fale comigo".
     Ida (~12s) → pausa 3s → volta pelo mesmo caminho (~12s) → pausa curta → repete. */
  const fold = document.querySelector(".fold");
  const cur = document.getElementById("cursor");
  const card = document.querySelector(".card");

  // Pontos do traçado em px da imagem de referência; origem = canto inferior direito do card (1336, 452)
  const REF = [
    [1578,195],[1585,300],[1592,400],[1580,440],[1555,470],[1500,488],[1420,500],[1345,505],
    [1290,495],[1245,470],[1230,435],[1255,395],[1310,382],[1360,385],[1395,420],[1410,470],
    [1405,520],[1380,555],[1330,580],[1250,602],[1050,608],[750,603],[510,578],[498,545],
    [510,520],[545,503],[620,498],[760,505],[830,500],[880,475],[918,445],[925,420],[922,405],
  ].map(([x, y]) => [x - 1336, y - 452]);
  const SCALE = 14 / 30;                 // texto do card: 14px no site ≈ 30px na imagem
  const GO = 20000, BACK = 20000, HOLD = 3000, REST = 1500;

  let path = null, sinceBuild = 1e9;

  // Catmull-Rom para suavizar e amostrar o traçado
  function spline(pts, per = 8) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (let k = 0; k < per; k++) {
        const t = k / per, t2 = t * t, t3 = t2 * t;
        out.push({
          x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
        });
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  function build() {
    const f = fold.getBoundingClientRect(), c = card.getBoundingClientRect();
    const ox = c.right - f.left, oy = c.bottom - f.top;
    // se faltar espaço à direita do card, comprime só a parte que fica à direita (sem vazar da tela)
    const room = f.width - ox - (cur.offsetWidth || 50) - 4;
    const maxRight = Math.max(...REF.map(p => p[0])) * SCALE;
    const kx = maxRight > room ? Math.max(0.2, room / maxRight) : 1;
    const pts = REF.map(([dx, dy]) => ({ x: ox + (dx > 0 ? dx * SCALE * kx : dx * SCALE), y: oy + dy * SCALE }));
    // o fim do traçado encaixa em "Fale comigo" de verdade (a quebra de linha do card muda conforme a tela)
    const link = document.querySelector(".card__cta .strong-link");
    if (link) {
      const lr = link.getBoundingClientRect();
      const target = { x: lr.left - f.left + lr.width * 0.2, y: lr.top - f.top + lr.height * 0.55 };
      const end = pts[pts.length - 1], cx = target.x - end.x, cy = target.y - end.y;
      const k = 22, n = pts.length - 1;                // a partir da curva que sobe em direção ao card
      for (let i = k; i <= n; i++) {
        const t = (i - k) / (n - k), w = t * t * (3 - 2 * t);
        pts[i] = { x: pts[i].x + cx * w, y: pts[i].y + cy * w };
      }
    }
    const smp = spline(pts);
    const lens = [0];
    for (let i = 1; i < smp.length; i++) lens.push(lens[i - 1] + Math.hypot(smp[i].x - smp[i - 1].x, smp[i].y - smp[i - 1].y));
    return { smp, lens, total: lens[lens.length - 1] };
  }

  function at(d) {
    const { smp, lens } = path;
    let lo = 0, hi = lens.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; lens[m] < d ? lo = m : hi = m; }
    const a = smp[lo], b = smp[hi], u = (d - lens[lo]) / ((lens[hi] - lens[lo]) || 1);
    return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
  }

  // aceleração e desaceleração naturais ao longo do percurso todo
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const CYCLE = GO + HOLD + BACK + REST;
  let clock = 0, last = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(50, last ? now - last : 16); last = now;
    // só anima com a primeira dobra na tela; o relógio congela fora dela
    const fr = fold.getBoundingClientRect();
    if (fr.bottom <= 0 || fr.top >= window.innerHeight) return;
    sinceBuild += dt;
    if (!path || sinceBuild > 1000) { path = build(); sinceBuild = 0; }
    clock = (clock + dt) % CYCLE;
    let u;
    if (clock < GO) u = ease(clock / GO);                                   // ida
    else if (clock < GO + HOLD) u = 1;                                      // parado em "Fale comigo"
    else if (clock < GO + HOLD + BACK) u = 1 - ease((clock - GO - HOLD) / BACK); // volta
    else u = 0;                                                             // pausa curta no início
    const p = at(u * path.total);
    cur.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
  }
  const go = () => requestAnimationFrame(frame);
  document.fonts ? document.fonts.ready.then(go) : go();
})();
