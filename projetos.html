<style>
/* Página de projetos: título central, filtros e grade de cards (mesmo card da home) */
.projects-page { padding-block: var(--space-fluid-48) 0; }
.projects-page__title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h1); line-height: var(--lh-h1); color: var(--fg); text-align: center; margin: 0 0 var(--space-fluid-48); }

.projects__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-fluid-32); }
.project { overflow: hidden; display: flex; flex-direction: column; min-width: 0; text-decoration: none; color: inherit; }  /* aparência: components.css */
.project:focus-visible { outline: 2px solid var(--select); outline-offset: 6px; }
.project__media { position: relative; aspect-ratio: 1167 / 552; min-height: 0; overflow: hidden; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-surface-alt); }
.project__media img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.project__body { padding: var(--space-fluid-32) var(--space-fluid-32) var(--space-fluid-48); display: flex; flex-direction: column; gap: var(--space-12); }
.project__title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h3); line-height: var(--lh-h3); color: var(--fg); margin: 0; text-wrap: balance; }
.project__text { font-size: var(--fs-lead); line-height: var(--lh-lead); margin: 0; }

/* Chamada para a página de design gráfico */
.more-gd {
  display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); align-items: stretch;
  margin-top: var(--space-fluid-96);
  overflow: hidden; text-decoration: none; color: inherit;
}
@media (hover: hover) { .more-gd:hover .more-gd__cta span { transform: translateX(4px); } }
.more-gd:focus-visible { outline: 2px solid var(--select); outline-offset: 6px; }
.more-gd__body { padding: var(--space-fluid-48); display: flex; flex-direction: column; justify-content: center; gap: var(--space-16); }
.more-gd__k { font-size: var(--fs-small); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; line-height: var(--lh-small); }
.more-gd__title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h2); line-height: var(--lh-h2); color: var(--fg); margin: 0; }
.more-gd__tags { margin-top: var(--space-4); }
.more-gd__cta { margin-top: var(--space-12); }
.more-gd__cta span { display: inline-block; transition: transform 200ms ease-out; }
.more-gd__mosaic {
  display: grid; gap: var(--space-12); padding: var(--space-16); background: var(--color-surface-alt); height: clamp(300px, 32vw, 440px);
  grid-template-columns: 1.15fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
  grid-template-areas: "a a b" "c d b" "c e e";
}
.more-gd__mosaic img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md); min-height: 0; }
.more-gd__mosaic .m1 { grid-area: a; }
.more-gd__mosaic .m2 { grid-area: b; }
.more-gd__mosaic .m3 { grid-area: c; }
.more-gd__mosaic .m4 { grid-area: d; object-fit: contain; background: #048985; }
.more-gd__mosaic .m5 { grid-area: e; }
@media (max-width: 760px) {
  .more-gd { grid-template-columns: minmax(0, 1fr); }
  .more-gd__mosaic { order: -1; height: 300px; }
}
@media (prefers-reduced-motion: reduce) { .more-gd:hover { transform: none; } }
@media (max-width: 760px) {
  .projects__grid { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>

<header id="site-header"></header>

<main class="container projects-page">
  <h1 class="projects-page__title">Projetos de Design</h1>
  <div class="projects__grid" id="grid"></div>

  <a class="more-gd" href="design-grafico.html">
    <div class="more-gd__body">
      <p class="more-gd__k">Também faço</p>
      <h2 class="more-gd__title">Design gráfico</h2>
      <ul class="tags more-gd__tags">
        <li class="tag">Identidade visual</li>
        <li class="tag">Campanhas</li>
      </ul>
      <span class="more-gd__cta">Ver trabalhos <span aria-hidden="true">→</span></span>
    </div>
    <div class="more-gd__mosaic" aria-hidden="true">
      <img class="m1" src="assets/grafico/enjoei/banner-02.jpg" alt="" loading="lazy" width="1400" height="437">
      <img class="m2" src="assets/grafico/capitaes/capa.jpg" alt="" loading="lazy" width="1500" height="913">
      <img class="m3" src="assets/grafico/garsoni/cartao.jpg" alt="" loading="lazy" width="1600" height="827">
      <img class="m4" src="assets/grafico/kippu/logo.jpg" alt="" loading="lazy" width="1600" height="719">
      <img class="m5" src="assets/grafico/dellas/tag.jpg" alt="" loading="lazy" width="1400" height="830">
    </div>
  </a>
</main>

<footer id="site-footer"></footer>
<script>
/* Conteúdo: para incluir um projeto, adicione um item aqui. href só quando houver página. */
const PROJECTS = [
  { title: "Plataforma jurídica CBRdoc", text: "Redesenho da experiência para transformar consultas pontuais em acompanhamento e monitoramento jurídico contínuo.", img: "cbrdoc", cat: ["ux"], href: "cases/cbrdoc.html" },
  { title: "Design System e redesign de plataforma SaaS", text: "Criação do Design System com tokens e redesign dos fluxos principais, com IA para gerar variações de tela, protótipos e documentação.", img: "cbrdoc-ds-capa-v5", cat: ["ux"], href: "cases/cbrdoc-ds.html" },
  { title: "Plataforma para gerenciar ações de ESG", text: "Solução que ajuda empresas com ações ESG. O projeto inclui imersão, prototipação e testes de usabilidade.", img: "esg-capa", cat: ["ux"], href: "cases/esg.html" },
  { title: "Interface para jogo", text: "Criação de componentes para a interface de um jogo de xadrez. Inclui telas como menu, seleção de modos, área social, loja e etc.", img: "jogo-xadrez-capa", cat: ["ux"], href: "cases/xadrez.html" },
  { title: "App Pão de Açúcar", text: "Estudo de caso de um projeto realizado como parte do time de design do GPA, focado na reestruturação do app Pão de Açúcar.", img: "pao-de-acucar-capa", cat: ["ux"], href: "https://www.behance.net/gallery/171264907/App-Pao-de-Acucar-2022", external: true },
  { title: "Design de APP para motoristas de fretado", text: "Aplicativo para motoristas de fretado que precisam aprender um trajeto novo ou acompanhar suas viagens com rotas atualizadas.", img: "app-motoristas-capa", cat: ["ux"], href: "cases/motoristas.html" },
  { title: "APP para passageiros | Mobile UI/UX", text: "Redesign de aplicativo, com foco em melhorar a experiência do usuário com nova identidade visual e funcionalidades otimizadas.", img: "app-passageiros-capa", cat: ["ux"], href: "cases/passageiros.html" },
  { title: "Redesign de Marca e Site", text: "Reformulação visual da marca e criação de site para startup de transporte, projeto otimiza layout para comunicar nova marca.", img: "fretadao-site", cat: ["ux"], href: "cases/marca-site.html" },
  { title: "Landing pages", text: "Páginas para diversos clientes com objetivo de guiar o usuário à ação e refletir a identidade visual de cada negócio.", img: "landing-pages", cat: ["ux"], href: "cases/landing-pages.html" },
];

const card = (p) => {
  const tag = p.href ? `a href="${p.href}"${p.external ? ' target="_blank" rel="noopener noreferrer"' : ""}` : "article";
  const end = p.href ? "a" : "article";
  return `<${tag} class="project" data-cat="${p.cat.join(" ")}">
    <div class="project__media">${p.img ? `<img src="assets/projetos/${p.img}.jpg" alt="" loading="lazy" width="1026" height="486">` : ""}</div>
    <div class="project__body">
      <h2 class="project__title">${p.title}</h2>
      <p class="project__text">${p.text}</p>
    </div>
  </${end}>`;
};

const grid = document.getElementById("grid");
grid.innerHTML = PROJECTS.map(card).join("");
</script>
